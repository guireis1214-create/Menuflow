services:
  - type: web
    name: menuflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: menuflow-data
      mountPath: /var/data
      sizeGB: 1
